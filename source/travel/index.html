            {latLng: [40.0, 124.23], name: 'Dandong', style: {r: 3, fill: 'yellow'}},
            {latLng: [40.6, 122.18], name: 'Yingkou', style: {r: 3, fill: 'yellow'}}

          ]
      var map1,
          map2;
      new jvm.MultiMap({
        container: $('#map1'),
        maxLevel: 1,
        mapUrlByCode: function(code, multiMap){
          return 'assets/us/jquery-jvectormap-data-'+code.toLowerCase()+'-'+multiMap.defaultProjection+'-en.js';
        },
        main: {
          map: 'world_mill_en',
          labels: {
            regions: {
              render: function(code){
                var doNotShow = ['US-RI', 'US-DC'];

                if (doNotShow.indexOf(code) === -1) {
                  return code.split('-')[1];
                }
              },
              offsets: function(code){
                return {
                  'CA': [-10, 10],
                  'ID': [0, 40],
                  'OK': [25, 0],
                  'LA': [-20, 0],
                  'FL': [45, 0],
                  'KY': [10, 5],
                  'VA': [15, 5],
                  'MI': [30, 30],
                  'AK': [50, -25],
                  'HI': [25, 50]
                }[code.split('-')[1]];
              }
            }
          },
          markers: markers,

          // regionsSelectable: true,
          // markersSelectable: true,
          // markersSelectableOne: true
